<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Gift Management</title>

<link rel="stylesheet" href="../../css/gifts.css">

</head>

<body>

<div class="container">

<button id="backBtn">← Dashboard</button>

<h1>🎁 Gift Management</h1>

<div class="form">

<input
id="giftId"
type="hidden">

<label>Title</label>

<input
id="title"
type="text"
placeholder="Gift title">

<label>Description</label>

<textarea
id="description"
placeholder="Write something about this gift..."
rows="4"></textarea>

<label>Gift Date</label>

<input
id="giftDate"
type="date">

<label>Gift Type</label>

<select id="giftType">

<option value="">Select Gift Type</option>

<option value="IMAGE">🖼️ Image</option>

<option value="VIDEO">🎥 Video</option>

<option value="PDF">📄 PDF</option>

<option value="LETTER">💌 Letter</option>

</select>

<label>Google Drive URL</label>

<input
id="driveUrl"
type="text"
placeholder="Paste Google Drive URL">

<button id="saveBtn">

Save Gift

</button>

</div>

<h2>🎁 Gifts</h2>

<table>

<thead>

<tr>

<th>ID</th>

<th>Title</th>

<th>Type</th>

<th>Date</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="giftTableBody">

</tbody>

</table>

</div>

<script src="../../js/gifts.js"></script>

</body>

</html>
