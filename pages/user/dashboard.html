<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MemoryVault ❤️</title>

    <link rel="stylesheet" href="../../css/user-dashboard.css">

</head>

<body>

<div class="container">

    <header>

        <h1>❤️ MemoryVault ❤️</h1>

        <p class="quote">
            "Every memory has a heartbeat."
        </p>

        <h2 id="welcomeText">
            Welcome ❤️
        </h2>

    </header>


    <div class="card-container">

        <div class="card" id="memoryCard">

            <div class="icon">📖</div>

            <h2>Our Memories</h2>

            <p>
                Read every beautiful memory we've shared together.
            </p>

        </div>


        <div class="card" id="galleryCard">

            <div class="icon">🖼️</div>

            <h2>Gallery</h2>

            <p>
                Every smile deserves a frame.
            </p>

        </div>


        <div class="card" id="giftCard">

            <div class="icon">🎁</div>

            <h2>Gifts</h2>

            <p>
                Little surprises with lots of love.
            </p>

        </div>


        <div class="card" id="musicCard">

            <div class="icon">🎵</div>

            <h2>Voices</h2>

            <p>
                Remembrance of you.
            </p>

        </div>

    </div>

</div>

<button id="logoutBtn">Logout</button>

<script src="../../js/user-dashboard.js"></script>

</body>
</html>
