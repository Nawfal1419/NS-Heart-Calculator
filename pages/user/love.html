<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MemoryVault ❤️🤍</title>

    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/love.css">

</head>

<body>

    <div class="love-container">

        <!-- Logo -->
        <div class="logo">
            ❤️ MemoryVault 🤍
        </div>

        <!-- Progress -->
        <div class="progress" id="progress">

            <span class="heart active">❤️</span>
            <span class="heart">🤍</span>
            <span class="heart">🤍</span>
            <span class="heart">🤍</span>
            <span class="heart">🤍</span>
            <span class="heart">🤍</span>

        </div>

        <!-- Question -->
        <div class="subtitle">
            Before we relive our memories...
        </div>

        <h1>
            Do you still love me? 100% ??
        </h1>

        <!-- Emoji -->
        <div id="emoji" class="emoji">
            😒
        </div>

        <!-- Message -->
        <div id="message" class="message">
            Really...?
        </div>

        <!-- Play Area -->
        <div id="playArea" class="play-area">

            <button id="yesBtn">

                <span class="btn-text">
                    YES ❤️
                </span>

            </button>

            <button id="noBtn">

                <span class="btn-text">
                    NO 😒
                </span>

            </button>

        </div>

    </div>

    <script src="../../js/love.js"></script>

</body>

</html>
